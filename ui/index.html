<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build my backend</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ground:#E7E7E3;--card:#F6F6F3;--ink:#171B2E;--soft:#5A6075;--line:#C9CAC4;--indigo:#1E2A4A;--tape:#F0BF2B;--tape-ink:#3A2F08;--bad:#A8341F;--good:#2C6A4C;--on-indigo:#E7E7E3;
--head:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Public Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ground:#14182A;--card:#1C2238;--ink:#E9E9E4;--soft:#9CA3BA;--line:#333B58;--indigo:#0D1121;--bad:#E8806B;--good:#7CC4A0}}
:root[data-theme="dark"]{color-scheme:dark;--ground:#14182A;--card:#1C2238;--ink:#E9E9E4;--soft:#9CA3BA;--line:#333B58;--indigo:#0D1121;--bad:#E8806B;--good:#7CC4A0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.55 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--indigo);color:var(--on-indigo);padding:28px 22px;display:flex;gap:16px;position:sticky;top:0;height:100vh;align-self:start}
.rule{width:22px;flex:none;border-radius:2px;position:relative;overflow:hidden;background:
 repeating-linear-gradient(to bottom,var(--tape-ink) 0 2px,transparent 2px 40px),
 repeating-linear-gradient(to bottom,var(--tape-ink) 0 1px,transparent 1px 8px),var(--tape);
 background-size:22px 100%,10px 100%,auto;background-repeat:repeat-y,repeat-y,no-repeat}
.rule i{position:absolute;inset:0 0 auto 0;height:calc(var(--p,0)*1%);background:rgba(23,27,46,.62);transition:height .6s ease}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;flex:1}
.stops li{font:500 15px/1.2 var(--head);opacity:.55}.stops li small{display:block;font:400 13px/1.35 var(--body);margin-top:3px}
.stops li.on{opacity:1}.stops li.on b{background:var(--tape);color:var(--tape-ink);padding:1px 7px;border-radius:2px}
.stops li.past{opacity:.85}
main{padding:56px clamp(20px,5vw,72px) 96px;max-width:820px}
h1{font:700 clamp(30px,4.4vw,46px)/1.08 var(--head);margin:0 0 14px;letter-spacing:-.01em}
h2{font:700 22px/1.2 var(--head);margin:28px 0 10px}
p.lead{color:var(--soft);margin:0 0 24px;max-width:56ch}
textarea,input[type=text],select{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:14px 16px}
textarea{min-height:150px;resize:vertical}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
textarea:focus,input:focus,select:focus{border-color:var(--ink)}
button{font:600 16px var(--body);cursor:pointer;border-radius:4px;padding:12px 20px;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
button.go{background:var(--tape);color:var(--tape-ink);border-color:var(--tape-ink)}
button.go:hover,a.btn:hover{background:#F6CE55}a.btn{display:inline-block;text-decoration:none;font:600 16px var(--body);border-radius:4px;padding:12px 20px;border:1.5px solid var(--tape-ink);background:var(--tape);color:var(--tape-ink)}button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.ex{font:400 15px var(--body);border-style:dashed;border-color:var(--soft);color:var(--soft)}
.choice{display:block;width:100%;text-align:left;margin-bottom:10px;background:var(--card);border-color:var(--line)}
.choice:hover{border-color:var(--ink)}
.q{font:500 clamp(24px,3vw,30px)/1.2 var(--head);margin:0 0 20px}
.count{color:var(--soft);font-size:15px;margin:0 0 8px}
.ent{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:16px 18px;margin-bottom:14px;box-shadow:5px 5px 0 var(--line)}
.ent h3{font:700 20px var(--head);margin:0 0 4px}.ent p{margin:0 0 10px;color:var(--soft);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:14px;background:var(--ground)}
.sent{border-left:4px solid var(--tape);padding-left:16px;margin:0 0 12px}
.do li{margin-bottom:4px}
.steps{list-style:none;padding:0;margin:20px 0}
.steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);animation:in .3s ease}
.steps .m{width:22px;flex:none;font-weight:700;text-align:center}
.steps .ok .m{color:var(--good)}.steps .bad .m{color:var(--bad)}.steps .bad{color:var(--bad)}
.steps .now .m{animation:spin 1s linear infinite;display:inline-block}
@keyframes in{from{opacity:0}to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
pre.log{background:var(--indigo);color:var(--on-indigo);padding:14px;border-radius:4px;font:13px/1.5 ui-monospace,Consolas,monospace;max-height:200px;overflow:auto}
.tabs{display:flex;gap:6px;margin:18px 0 0}.tabs button{border-radius:4px 4px 0 0;border-bottom:none}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--ground)}
.panel{background:var(--card);border:1.5px solid var(--ink);padding:18px;border-radius:0 4px 4px 4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{font-size:14px;color:var(--soft);display:block;margin-bottom:4px}
.tblwrap{overflow-x:auto;margin-top:16px}table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--soft);font-weight:600}
.note{color:var(--soft);font-size:14px}.err{color:var(--bad);font-size:15px;margin-top:8px}
details.study{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:8px 12px;font-size:14px;max-width:240px}
details.study summary{cursor:pointer;color:var(--soft)}details.study label{color:var(--ink);margin:10px 0 0}
.badge{display:inline-block;font-size:14px;color:var(--soft);margin-bottom:14px}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:column;padding:16px 20px}
 .rule{width:100%;height:22px;background:
  repeating-linear-gradient(to right,var(--tape-ink) 0 2px,transparent 2px 40px),
  repeating-linear-gradient(to right,var(--tape-ink) 0 1px,transparent 1px 8px),var(--tape);background-size:100% 22px,100% 10px,auto}
 .rule i{inset:0 auto 0 0;width:calc(var(--p,0)*1%);height:auto;transition:width .6s ease}
 .stops{flex-direction:row;gap:8px;overflow:hidden}.stops li small{display:none}.stops li:not(.on){display:none}
 main{padding-top:28px}details.study{position:static;margin:24px 20px;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside aria-label="Progress"><div class="rule" id="rule" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div><ol class="stops" id="stops"></ol></aside>
<main id="main" aria-live="polite"></main>
</div>
<details class="study"><summary>Test setup</summary>
<label for="vPlan">Plan is shown as</label><select id="vPlan"><option value="cards">Cards</option><option value="sent">Sentences</option></select>
<label for="vLog">Progress shows</label><select id="vLog"><option value="steps">Steps only</option><option value="both">Steps and technical log</option></select>
<p class="note">Recorded session. Live mode reads the same events from the agent (see EVENTS in the script).</p></details>
<script>
/* EVENTS: the only place to adapt to the agent's real events (trace.jsonl).
   Each raw event {type, ...} is turned into a plain sentence by say(). */
const SESSION={
 request:"I run a tailoring shop. I need to keep track of customers, their measurements and their orders.",
 questions:[
  {q:"Who will use this besides you?",opts:["Just me","Me and my staff"]},
  {q:"Do you want to record deposits and what is still owed?",opts:["Yes, deposit and balance","No, only the price"]},
  {q:"How should an order’s progress be shown?",opts:["New, cutting, sewing, ready, collected","Just done or not done"]}],
 plan:[
  {name:"Customers",about:"One record for every person you sew for.",fields:["Full name","Phone number","Notes"]},
  {name:"Measurements",about:"Taken at a fitting and kept with the customer, so you can see how they change.",fields:["Customer","Chest","Waist","Hip","Length","Date taken"]},
  {name:"Orders",about:"What each customer asked you to make.",fields:["Customer","Garment","Due date","Price","Deposit paid","Progress"]}],
 can:["Add, change and find customers by name or phone","Save a new set of measurements for a customer","Create an order and move it from new to collected","See which orders are due this week"],
 events:[
  [700,"write models.py",{t:"Setting up your customer list"}],
  [900,"write routes/orders.py",{t:"Setting up measurements and orders"}],
  [800,"write schema.sql",{t:"Linking each order to its customer"}],
  [1100,"run pytest (14 tests)",{t:"Checking everything works",fail:"Found a problem: an order could be saved without a customer. Fixing it (attempt 1 of 3)"}],
  [1100,"edit routes/orders.py",null],
  [1000,"run pytest (14 tests)",{t:"Checking again: all 14 checks passed",ok:1}]]
};
const $=s=>document.querySelector(s),main=$("#main");
const API=new URLSearchParams(location.search).get("api")||"http://localhost:8000"; /* where the built backend runs */
const STAGES=[["Describe","What you need"],["Questions","So we get it right"],["Plan","Your approval"],["Build","We do the work"],["Try it","Use it, then take it"]];
let st=0,qi=0,answers=[],log=[],data={},changes=[],tm=[],activity=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tape(p){$("#stops").innerHTML=STAGES.map((s,i)=>`<li class="${i==st?"on":i<st?"past":""}"><b>${s[0]}</b><small>${s[1]}</small></li>`).join("");
 const r=$("#rule");r.style.setProperty("--p",p??st*25);r.setAttribute("aria-valuenow",Math.round(p??st*25));r.setAttribute("aria-label","Step "+(st+1)+" of 5: "+STAGES[st][0])}
function go(n,p){tm.forEach(clearTimeout);tm=[];st=n;tape(p);window.scrollTo(0,0);[describe,ask,plan,build,tryit][n]();main.focus?.()}
function describe(){main.innerHTML=`<h1>Tell us what you run.</h1><p class="lead">Write it the way you would tell a friend. You do not need technical words.</p>
<label for="req">What do you need to keep track of?</label><textarea id="req" placeholder="For example: I run a bakery and need to track customers and their orders."></textarea>
<div class="row"><button class="ex" data-x="${esc(SESSION.request)}">Tailoring shop</button><button class="ex" data-x="I run a church. People sign up for events and I need to see who is coming.">Church sign-up</button><button class="ex" data-x="I sell bread to shops every morning and need to know who ordered what.">Bakery orders</button></div>
<div class="row"><button class="go" id="send">Send</button></div><p class="err" id="e"></p>`;
 main.querySelectorAll(".ex").forEach(b=>b.onclick=()=>{$("#req").value=b.dataset.x;$("#req").focus()});
 $("#send").onclick=()=>{const v=$("#req").value.trim();if(v.length<15){$("#e").textContent="Add a little more: say what you sell or do, and what you want to keep track of.";return}data.req=v;qi=0;answers=[];go(1)}}
function ask(){const q=SESSION.questions[qi];
 main.innerHTML=`<span class="badge">Recorded session</span><p class="count">Question ${qi+1} of ${SESSION.questions.length}. You can skip any of them.</p><h1 class="q">${q.q}</h1>
 ${q.opts.map((o,i)=>`<button class="choice" data-i="${i}">${o}</button>`).join("")}
 <label for="own">Or answer in your own words</label><input type="text" id="own"><div class="row"><button id="ok" class="go">Next</button><button id="skip">Skip</button></div>`;
 const next=a=>{answers.push(a);qi++;qi<SESSION.questions.length?ask():go(2)};
 main.querySelectorAll(".choice").forEach(b=>b.onclick=()=>next(q.opts[b.dataset.i]));
 $("#ok").onclick=()=>next($("#own").value.trim()||"(skipped)");$("#skip").onclick=()=>next("(skipped)")}
function plan(){const cards=$("#vPlan").value=="cards";
 const body=cards?SESSION.plan.map(e=>`<div class="ent"><h3>${e.name}</h3><p>${e.about}</p><div class="chips">${e.fields.map(f=>`<span>${f}</span>`).join("")}</div></div>`).join("")
 :SESSION.plan.map(e=>`<p class="sent"><b>${e.name}.</b> ${e.about} Each one has: ${e.fields.join(", ").toLowerCase()}.</p>`).join("");
 main.innerHTML=`<h1>Here is what we will build for you.</h1><p class="lead">Nothing is built until you say so. Read it through and tell us if anything is wrong.</p>
 <h2>What it will keep track of</h2>${body}<h2>What you will be able to do</h2><ul class="do">${SESSION.can.map(c=>`<li>${c}</li>`).join("")}</ul>
 <div class="row"><button class="go" id="yes">Approve and build</button><button id="chg">Change something</button><button id="re">Start over</button></div>
 <div id="chbox"></div>`;
 $("#yes").onclick=()=>go(3,50);$("#re").onclick=()=>go(0);
 $("#chg").onclick=()=>{$("#chbox").innerHTML=`<h2>What should be different?</h2><textarea id="chtxt" placeholder="For example: I also need to record the fabric for each order."></textarea><div class="row"><button class="go" id="chok">Update the plan</button></div>`;$("#chtxt").focus();
  $("#chok").onclick=()=>{const v=$("#chtxt").value.trim();if(!v)return;changes.push(v);SESSION.can.push("Also: "+v);plan()}}}
function say(i,ev){return ev}
function build(){log=[];const L=[];const showLog=$("#vLog").value=="both";
 main.innerHTML=`<h1>Building it now.</h1><p class="lead">This takes a few minutes. You can leave this page open.</p><ul class="steps" id="steps"></ul>${showLog?'<pre class="log" id="log" aria-label="Technical log"></pre>':""}`;
 let t=0,i=0;const total=SESSION.events.length;
 SESSION.events.forEach(([d,raw,f],k)=>{t+=d;tm.push(setTimeout(()=>{
  if(showLog){$("#log").textContent+=`$ ${raw}\n`}
  const ul=$("#steps");ul.querySelectorAll(".now").forEach(x=>{x.className="ok";x.querySelector(".m").textContent="✓"});
  if(f){if(f.fail){ul.insertAdjacentHTML("beforeend",`<li class="bad"><span class="m">!</span><span>${f.fail}</span></li>`)}
   ul.insertAdjacentHTML("beforeend",`<li class="${f.ok?"ok":"now"}"><span class="m">${f.ok?"✓":"○"}</span><span>${f.t}</span></li>`)}
  tape(50+((k+1)/total)*50);
  if(k==total-1)tm.push(setTimeout(()=>go(4,100),1100))},t))})}
function fieldInput(f){return /date/i.test(f)?`<input type="date" id="f-${f}">`:/progress/i.test(f)?`<select><option>New</option><option>Cutting</option><option>Sewing</option><option>Ready</option><option>Collected</option></select>`:`<input type="text" id="f-${f}">`}
function tryit(){data.rows=data.rows||{};let cur=0;
 const draw=()=>{const e=SESSION.plan[cur],rows=data.rows[e.name]=data.rows[e.name]||[];
  main.innerHTML=`<h1>It works. Try it.</h1><p class="lead">Add a test record to see how it behaves. Your test records are only kept while this page is open.</p>
  <div class="tabs" role="tablist">${SESSION.plan.map((p,i)=>`<button role="tab" aria-selected="${i==cur}" data-i="${i}">${p.name}</button>`).join("")}</div>
  <div class="panel"><div class="form">${e.fields.map(f=>`<div><label>${f}</label>${fieldInput(f)}</div>`).join("")}</div>
  <div class="row"><button class="go" id="add">Save ${e.name.toLowerCase().replace(/s$/,"")}</button></div><p class="err" id="e"></p>
  <div class="tblwrap">${rows.length?`<table><tr>${e.fields.map(f=>`<th>${f}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)||"–"}</td>`).join("")}</tr>`).join("")}</table>`:`<p class="note">No ${e.name.toLowerCase()} yet. Fill in the boxes above and save one.</p>`}</div></div>
  <h2>See it working</h2><p class="lead" style="margin-bottom:12px">Swagger UI lists every action your system offers and lets you try each one.</p><div class="row" style="margin-top:0"><a class="btn" href="${API}/docs" target="_blank" rel="noopener">Open Swagger UI</a><button id="ex">Download explorer page</button></div><p class="note">Opens ${API}/docs. It only works while your system is running.</p>${activity.length?`<div class="tblwrap"><table><tr><th>Time</th><th>Request</th><th>Result</th></tr>${activity.slice(0,6).map(a=>`<tr><td>${a.t}</td><td>${a.m} ${a.p}</td><td>${a.s} saved</td></tr>`).join("")}</table></div>`:`<p class="note">Recent activity appears here. Save a record above to see the request.</p>`}<h2>Take it with you</h2><div class="row"><button class="go" id="dl">Download the API description</button><button id="cp">Copy the address</button></div><p class="note" id="msg">The description is the file any app developer needs to connect to your system.</p>
  <h2>Want to change something?</h2><div class="row" style="margin-top:0"><input type="text" id="cx" style="flex:1;min-width:220px" placeholder="For example: add the fabric to each order"><button id="cb">Make the change</button></div>
  ${changes.length?`<p class="note">Changes so far: ${changes.map(esc).join("; ")}</p>`:""}`;
  main.querySelectorAll("[role=tab]").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});
  $("#add").onclick=()=>{const v=[...main.querySelectorAll(".form input,.form select")].map(x=>x.value);if(!v[0]){$("#e").textContent="Fill in the first box before saving.";return}rows.push(v);activity.unshift({m:"POST",p:"/"+e.name.toLowerCase(),s:201,t:new Date().toLocaleTimeString()});draw()};
  $("#dl").onclick=()=>{const paths={};SESSION.plan.forEach(p=>{const n="/"+p.name.toLowerCase();paths[n]={get:{summary:"List "+p.name},post:{summary:"Add to "+p.name}}});
   const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({openapi:"3.0.3",info:{title:"My shop backend",version:"1.0"},paths},null,2)],{type:"application/json"}));a.download="openapi.json";a.click();$("#msg").textContent="Downloaded openapi.json."};
  $("#cp").onclick=()=>{navigator.clipboard?.writeText("http://localhost:8000");$("#msg").textContent="Copied http://localhost:8000"};
  $("#ex").onclick=()=>{const h=`<!doctype html><title>API explorer</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"><div id="ui"></div><script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"><\/script><script>SwaggerUIBundle({url:"${API}/openapi.json",dom_id:"#ui"})<\/script>`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download="api-explorer.html";a.click();$("#msg").textContent="Downloaded api-explorer.html. Open it while your system is running."};
  $("#cb").onclick=()=>{const v=$("#cx").value.trim();if(!v)return;changes.push(v);$("#cb").textContent="Updating…";setTimeout(()=>{$("#cb").textContent="Make the change";draw()},1400)}};
 draw()}
$("#vPlan").onchange=()=>st==2&&plan();
tape(0);go(0);
</script>
<script>
/* LIVE mode (?live): the same screens, driven by ui/server.py and the real builder events */
const LIVE=new URLSearchParams(location.search).has("live");
if(LIVE)(()=>{
let sid=null,Q=[],A=[],P=null,chg=false;
const api=(u,b)=>fetch("/api/"+u,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j});
const wait=t=>{main.innerHTML=`<h1>${t}</h1><p class="lead">This can take about half a minute.</p>`};
const fail=(e,f)=>{main.insertAdjacentHTML("beforeend",`<p class="err">That did not work: ${esc(e.message)}</p><div class="row"><button class="go" id="rt">Try again</button></div>`);$("#rt").onclick=f};
const L=x=>Array.isArray(x)?x.map(y=>typeof y=="string"?y:y.name||y.title||JSON.stringify(y)):typeof x=="string"?[x]:Object.keys(x||{});
const d0=describe;describe=()=>{sid=null;d0()};
const next=()=>{wait("Writing your plan…");api(sid+"/answers",{answers:A}).then(r=>{P=r.plan;go(2)}).catch(e=>fail(e,next))};
ask=()=>{
 if(!sid){wait("Reading what you wrote…");return api("start",{request:data.req}).then(r=>{sid=r.id;Q=r.questions;qi=0;A=[];Q.length?ask():next()}).catch(e=>fail(e,()=>go(0)))}
 main.innerHTML=`<p class="count">Question ${qi+1} of ${Q.length}. You can skip any of them.</p><h1 class="q">${esc(Q[qi])}</h1><label for="own">Your answer</label><textarea id="own" style="min-height:90px"></textarea><div class="row"><button class="go" id="ok">Next</button><button id="skip">Skip</button></div>`;
 const nx=a=>{A.push(a);++qi<Q.length?ask():next()};
 $("#ok").onclick=()=>nx($("#own").value.trim());$("#skip").onclick=()=>nx("");$("#own").focus()};
plan=()=>{
 const ents=(Array.isArray(P.data)?P.data:Object.entries(P.data||{}).map(([k,v])=>({name:k,fields:v}))).map(d=>`<div class="ent"><h3>${esc(d.name||d.entity||"")}</h3><div class="chips">${L(d.fields||d.columns||d.keeps||[]).map(f=>`<span>${esc(f)}</span>`).join("")}</div></div>`).join("");
 const eps=(P.endpoints||[]).map(e=>`<li>${esc(e.what||e.does||e.description||e.summary||"")} <span class="note">(${esc((e.method||"")+" "+(e.path||""))})</span></li>`).join("");
 main.innerHTML=`<h1>Here is what we will build for you.</h1><p class="lead">${esc(P.summary||"")} Nothing is built until you say so.</p><h2>What it will keep track of</h2>${ents}<h2>What you will be able to do</h2><ul class="do">${eps}</ul>${(P.rules||[]).length?`<h2>Rules it will follow</h2><ul class="do">${P.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}<div class="row"><button class="go" id="yes">Approve and build</button><button id="chg">Change something</button><button id="re">Start over</button></div><div id="chbox"></div>`;
 $("#yes").onclick=()=>{chg=false;go(3,50)};$("#re").onclick=()=>go(0);
 $("#chg").onclick=()=>{$("#chbox").innerHTML=`<h2>What should be different?</h2><textarea id="chtxt" placeholder="For example: I also need a phone number for each customer."></textarea><div class="row"><button class="go" id="chok">Update the plan</button></div>`;$("#chtxt").focus();
  $("#chok").onclick=()=>{const v=$("#chtxt").value.trim();if(!v)return;wait("Updating your plan…");api(sid+"/plan",{text:v}).then(r=>{P=r.plan;plan()}).catch(e=>fail(e,plan))}}};
build=()=>{
 main.innerHTML=`<h1>Building it now.</h1><p class="lead">This takes a minute or two. You can leave this page open.</p><ul class="steps" id="steps"></ul><pre class="log" id="log" hidden></pre>`;
 let n=0,last="";
 const add=(t,c)=>{if(t==last)return;last=t;const ul=$("#steps");ul.querySelectorAll(".now").forEach(x=>{x.className="ok";x.querySelector(".m").textContent="✓"});ul.insertAdjacentHTML("beforeend",`<li class="${c}"><span class="m">${c=="ok"?"✓":c=="bad"?"!":"○"}</span><span>${esc(t)}</span></li>`)};
 (chg?Promise.resolve():api(sid+"/approve",{})).then(()=>{
  const es=new EventSource("/api/"+sid+"/events");
  es.onmessage=m=>{const e=JSON.parse(m.data);tape(Math.min(95,50+(++n)*5));
   if(e.event=="tool"){const t=e.tool;
    if(t=="write_file")add("Writing your system","now");else if(t=="edit_file")add("Making your change","now");
    else if(t=="run_tests"){const f=e.tests?.failed||0;f?add("Found a problem in "+f+" check"+(f>1?"s":"")+". Fixing it","bad"):add("Checking it works: "+(e.tests?.passed??0)+" checks passed","ok")}
    else if(t=="start_server"||t=="send_request")add("Trying it out","now");else add("Looking over what exists","now")}
   else if(e.event=="error"){es.close();fail(new Error("the build stopped ("+e.message+")"),()=>go(2))}
   else if(e.event=="end"){es.close();e.stop=="end_turn"?go(4,100):fail(new Error("the build stopped early ("+e.stop+")"),()=>go(2))}};
  es.onerror=()=>{es.close();fail(new Error("lost the connection to the builder"),()=>go(3))}}).catch(e=>fail(e,()=>go(2)))};
tryit=()=>{wait("Opening your system…");api(sid+"/result").then(r=>{
 main.innerHTML=`<h1>It is built.</h1><p class="lead">${esc(r.summary||"")}</p>${r.follows_plan&&(r.follows_plan.missing||[]).length?`<p class="err">Not everything in the plan was built: ${r.follows_plan.missing.map(esc).join(", ")}.</p>`:""}
 <h2>See it working</h2><div class="row" style="margin-top:0">${r.app_url?`<a class="btn" href="${esc(r.app_url)}/docs" target="_blank" rel="noopener">Open Swagger UI</a>`:""}<a class="btn" href="/api/${sid}/app.py" download>Download the program</a></div>${r.app_url?"":`<p class="note">Your system is built but not running yet, so Swagger UI is not available.</p>`}
 <h2>Want to change something?</h2><div class="row" style="margin-top:0"><input type="text" id="cx" style="flex:1;min-width:220px" placeholder="For example: people must be able to cancel"><button id="cb">Make the change</button></div>`;
 $("#cb").onclick=()=>{const v=$("#cx").value.trim();if(!v)return;api(sid+"/change",{text:v}).then(()=>{chg=true;go(3,50)}).catch(e=>fail(e,tryit))}}).catch(e=>fail(e,()=>go(2)))};
})();
</script>
</body>
</html>
