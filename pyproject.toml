[project]
name = "nlp-group-1-prosit-2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pytest",
    "sqlmodel",
    "uvicorn",
]

[project.optional-dependencies]
kb = ["sentence-transformers"]  # dense recipe search (kb/search.py): uv run --extra kb ...

[tool.pytest.ini_options]
testpaths = ["benchmark"]
python_files = ["test_*.py"]
