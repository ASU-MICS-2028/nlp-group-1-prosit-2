name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No API keys, .env or model files
        run: python3 scripts/check_secrets.py --all
      - name: README status, plan views and decisions index are current
        run: python3 scripts/update_status.py --check
